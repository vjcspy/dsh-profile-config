ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
codex-subscription:
  searchProvider: codex
agent-presets:
  default: standard
agent-default-model:
  provider: opencode-go
  model: deepseek-v4.1-flash
permission:
  defaultPreset: danger-full-access
dsh-better-sidebar:
  tabsEnabled:
    git: true
    browser: true
  autoOpenSubagent: true
  agentTerminalTools: false
  browserNoSandbox: true
  agentOpenTools: false
  editorExplorer: false
catppuccin:
  flavor: off
  glass:
    enabled: false
    mode: mica
    blur: 2
    frost: 20
    brightness: 50
  autoCheck: true
  updateChannel: latest
  overrides: {}
  shikiStyle: default
ui-theme:
  preference: system
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: deepseek-official
      model: deepseek-flash
    - provider: opencode-go
      model: deepseek-v4.1-flash
    - provider: opencode-go
      model: grok-4.6
    - provider: opencode-go
      model: muse-spark-1.3-contributor
    - provider: codex
      model: gpt-5.6-sol
dsh-project-context-mcp:
  servers:
    - id: c791df3e-0026-4081-b8fd-5cdbb0423949
      serverName: Monolith
      enabled: true
      transport: streamable-http
      command: ""
      args: []
      env: {}
      cwd: ""
      url: http://localhost:3845/mcp
      headers: {}
      toolCallTimeoutMs: 60000
      maxInstructionBytes: 0
    - id: 1f81faae-bd32-4420-b932-c41c68c07358
      serverName: DocContext
      enabled: true
      transport: streamable-http
      command: ""
      args: []
      env: {}
      cwd: ""
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: <REDACTED>
      toolCallTimeoutMs: 60000
      maxInstructionBytes: 0
ui-chat:
  transcriptView: normal
dsh-chat-wide:
  widthPercent: 95
