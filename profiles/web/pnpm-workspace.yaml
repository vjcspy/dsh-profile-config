packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
# Personal project: do not hold back freshly published releases. pnpm 11
# defaults to a ~1-day supply-chain delay, which blocks installing our own and
# third-party plugins the day they ship.
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - dsh-codex-subscription@1.0.6
  - dsh-better-sidebar@0.19.0
  - '@deepseek-ai/cosmokit@1.8.4'
  - '@deepseek-ai/schemastery@3.18.3'
  - dsh-opencode-go@0.1.7 || 0.1.8 || 0.1.9
  - dshmarket@1.55.0
allowBuilds:
  '@google/genai': false
  node-pty: true
  protobufjs: false
  cloudflared: true
  # `false` is deliberate: dsh-opencode-go's postinstall materializes fixture
  # links for its OWN repository's test suite (tests/hosts/*), which has no
  # meaning inside a profile install. Leaving pnpm's placeholder here made
  # every profile install and `dsh plugin add` exit non-zero.
  dsh-opencode-go@file:../../../dsh-opencode-go: false
patchedDependencies:
  dsh-plugin-subscriptions@0.9.4: patches/dsh-plugin-subscriptions@0.9.4.patch
