# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: dsh-opencode-go
    model: deepseek-v4.1-flash
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: compact
- id: dsh-project-context
  name: dsh-project-context
  config:
    mcp:
      servers:
        - id: c791df3e-0026-4081-b8fd-5cdbb0423949
          serverName: Monolith
          enabled: true
          transport: streamable-http
          command: ''
          args: []
          env: {}
          cwd: ''
          url: http://localhost:3845/mcp
          headers: {}
          toolCallTimeoutMs: 60000
          maxInstructionBytes: 0
        - id: 1f81faae-bd32-4420-b932-c41c68c07358
          serverName: DocContext
          enabled: true
          transport: streamable-http
          command: ''
          args: []
          env: {}
          cwd: ''
          url: https://mcp.context7.com/mcp
          headers:
            CONTEXT7_API_KEY: CONTEXT7_API_KEY
          toolCallTimeoutMs: 60000
          maxInstructionBytes: 0
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    workspaceFence: false
    autoOpenSubagent: true
    tasksViewMode: graph
    mobileDefaultTree: false
    agentOpenTools: false
    editorExplorer: false
    tabsEnabled:
      git: true
      browser: true
      editor: true
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    modeSelectionEnabled: false
- id: remote-web-ui
  name: '@linxin666/dsh-remote-web-ui'
  config:
    enabled: true
    autoTunnel: false
    relay: false
    publicBaseUrl: https://dsh.bluestone.systems
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: queue
- id: subagent-claude-code
  name: '@deepseek-ai/dsh-subagent-claude-code'
  config:
    permissionMode: bypassPermissions
- id: dsh-session-workspaces
  name: dsh-session-workspaces
  config:
    enabled: true
    provider: dsh-opencode-go
    model: glm-5.3-flash
    candidates: []
    unknownLabel: Ungrouped
    confidence: 0.5
- id: session-title-llm
  disabled: true
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: opencode-go
  name: dsh-opencode-go
  config:
    modelVisibility:
      minimax-m2.7: false
      kimi-k2.7-code: false
      glm-5.2: false
      glm-5.1: false
      deepseek-v4-flash: false
      qwen3.7-plus: false
      mimo-v2.5-pro: false
      mimo-v2.5: false
      muse-spark-1.2-contributor: false
      grok-4.6: false
      gpt-5.6-luna: false
    apiKeyEnv: DSH_OPENCODE_GO_ACCOUNT_400B07F35A650C96886503855E3682F9
    accounts:
      - id: 400b07f35a650c96886503855e3682f9
        name: dinhkhoi.le05
        apiKeyEnv: DSH_OPENCODE_GO_ACCOUNT_400B07F35A650C96886503855E3682F9
      - id: legacy:OPENCODE_API_KEY
        name: mr.vjcspy
        apiKeyEnv: OPENCODE_API_KEY
    autoSwitch: true
- id: dsh-ssh-hosts
  name: dsh-ssh-hosts
  config:
    hostsFile: ~/work/aweave/user/ssh/hosts.yaml
    probeTimeoutMs: 2000
    probeConcurrency: 8
- id: dsh-intellij-git
  name: dsh-intellij-git
  config:
    aweaveRoot: /Users/P823468/work/aweave
    gitTimeoutMs: 30000
    llmProvider: ''
    llmModel: ''
